<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>나의 알고리즘 그래픽웹</title>
<style>
:root{--u:min(calc(100vw / 1440), calc(100vh / 900));--bg:#fcfcfb;--ink:#141414;--ink2:#5a5955;--muted:#8d8b85;--line:rgba(20,20,20,.09);--panel:rgba(252,252,251,.86)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
  font-family:"Pretendard","Apple SD Gothic Neo",system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:400}
canvas{display:block;position:fixed;inset:0;cursor:grab;outline:none}
.lb{position:absolute;left:0;top:0;white-space:nowrap;font-weight:400;color:#1c1c1c;letter-spacing:-.01em;line-height:1.2;display:none;will-change:transform;pointer-events:auto;text-decoration:none;cursor:pointer}
.lb:hover{text-decoration:underline;text-underline-offset:2px;color:#000}
header{position:fixed;top:calc(24*var(--u));left:0;right:0;text-align:center;pointer-events:none;transition:opacity .2s ease}
header h1{margin:0;line-height:calc(30*var(--u));font-size:calc(22*var(--u));font-weight:500;letter-spacing:-.01em}
header p{margin:calc(6*var(--u)) 0 0;font-size:calc(12*var(--u));color:var(--ink2)}

.seg{display:flex;height:calc(30*var(--u));align-items:center;gap:calc(2*var(--u));background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:calc(2*var(--u));backdrop-filter:blur(8px)}

.seg button{border:0;background:none;color:var(--ink2);font:inherit;font-size:calc(11*var(--u));line-height:calc(24*var(--u));padding:0 calc(9*var(--u));border-radius:2px;cursor:pointer}
.seg button.on{background:var(--ink);color:var(--bg)}
.legend{position:fixed;left:calc(24*var(--u));bottom:calc(24*var(--u));width:calc(252*var(--u));background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:calc(10*var(--u)) calc(12*var(--u));backdrop-filter:blur(8px)}
.legend h2{margin:0;font-size:calc(11*var(--u));font-weight:500}
.lgHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:calc(8*var(--u))}
.all{display:flex;align-items:center;gap:calc(4*var(--u));font-size:calc(10*var(--u));color:var(--ink2);cursor:pointer;user-select:none}
.all input{margin:0;width:calc(10*var(--u));height:calc(10*var(--u));accent-color:var(--ink);cursor:pointer}
#bar{display:flex;height:calc(6*var(--u));gap:calc(2*var(--u));margin-bottom:calc(9*var(--u))}
#bar span{display:block;height:100%}
#lg{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:calc(3*var(--u)) calc(10*var(--u))}
#lg li{display:flex;align-items:center;gap:calc(5*var(--u));font-size:calc(11*var(--u));white-space:nowrap;color:var(--ink2);cursor:pointer;user-select:none}
#lg li i{width:calc(7*var(--u));height:calc(7*var(--u));border-radius:50%;flex:none}
#lg li b{margin-left:auto;font-weight:400;color:var(--ink);font-variant-numeric:tabular-nums}
#lg li.off{opacity:.3}
.note{margin:calc(8*var(--u)) 0 0;font-size:calc(10*var(--u));line-height:1.5;color:var(--muted)}
#tip{position:fixed;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:calc(8*var(--u)) calc(10*var(--u));font-size:calc(12*var(--u));line-height:1.55;display:none;max-width:calc(240*var(--u));backdrop-filter:blur(8px)}
#tip strong{display:block;font-size:calc(13*var(--u));font-weight:500}
#tip span{display:block;color:var(--ink2)}
#tip em{display:block;font-style:normal}
.help{position:fixed;right:calc(24*var(--u));bottom:calc(24*var(--u));text-align:right;font-size:calc(11*var(--u));line-height:1.7;color:var(--muted)}
.help button{border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-size:calc(11*var(--u));padding:calc(4*var(--u)) calc(9*var(--u));border-radius:2px;cursor:pointer}

.panel{position:fixed;pointer-events:none;overflow:hidden;display:none;z-index:1}
header,.ctrl,.legend,#overlap,.help,#tip{z-index:5}
.ptitle{position:absolute;left:calc(24*var(--u));top:calc(24*var(--u));line-height:calc(30*var(--u));white-space:nowrap;transition:opacity .2s ease;pointer-events:none}
.ptitle b{font-size:calc(14*var(--u));font-weight:500}
.ptitle span{margin-left:calc(8*var(--u));font-size:calc(11*var(--u));color:var(--ink2)}
.panel.month .ptitle{top:calc(8*var(--u));left:calc(14*var(--u))}
.panel.month{box-shadow:inset -1px -1px 0 var(--line)}
body[data-mode=single] .panel.me .ptitle{display:none}
body[data-mode=compare][data-cmp=side] .panel.me{box-shadow:inset -1px 0 0 var(--line)}
.ctrl{position:fixed;top:calc(24*var(--u));right:calc(24*var(--u));display:flex;gap:calc(8*var(--u))}
#cmp{display:none}
body[data-mode=compare] #cmp{display:flex}
body[data-mode=months] #views,body[data-mode=months] .legend{display:none}
#overlap{display:none;position:fixed;left:50%;bottom:calc(24*var(--u));transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:calc(8*var(--u)) calc(14*var(--u));text-align:center;font-size:calc(11*var(--u));color:var(--ink2);backdrop-filter:blur(8px);white-space:nowrap}
body[data-mode=compare][data-cmp=merge] #overlap{display:block}
#overlap b{color:var(--ink);font-weight:500;font-size:calc(13*var(--u));margin-left:calc(4*var(--u))}
#overlap span{display:block;margin-top:calc(2*var(--u));font-size:calc(10*var(--u))}
#lgHead{display:grid;grid-template-columns:1fr calc(62*var(--u)) calc(62*var(--u));font-size:calc(10*var(--u));color:var(--muted);margin-bottom:calc(4*var(--u))}
#lgHead b{text-align:right;font-weight:400;overflow:hidden;text-overflow:ellipsis}
#lg.two{grid-template-columns:1fr}
#lg.two li{display:grid;grid-template-columns:1fr calc(62*var(--u)) calc(62*var(--u))}
#lg.two li b{text-align:right}
#lg li span{display:flex;align-items:center;gap:calc(5*var(--u))}
</style>
</head>

<header id="header"><h1>나의 알고리즘 그래픽웹</h1><p id="sub"></p></header>

</div>
